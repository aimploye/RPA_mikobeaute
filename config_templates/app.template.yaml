app:
  name: "POSReportBot"
  work_dir: "C:\\ProgramData\\POSReportBot"
  downloads_dir: "C:\\ProgramData\\POSReportBot\\downloads"
  output_dir: "C:\\ProgramData\\POSReportBot\\output"
  logs_dir: "C:\\ProgramData\\POSReportBot\\logs"
  screenshots_dir: "C:\\ProgramData\\POSReportBot\\screenshots"
  state_dir: "C:\\ProgramData\\POSReportBot\\state"
  language: "zh-TW"

pos:
  executable_path: "C:\\Users\\MIKO\\AppData\\Roaming\\Microsoft\\Windows\\Start Menu\\Programs\\台灣凱惠資訊科技有限公司\\SPA1\\SPA資訊服務應用系統.appref-ms"
  launch_args: ""
  working_dir: ""
  window_title_contains: "SPA-POS"
  window_title_regex: ""
  backend: "auto"   # auto | uia | win32
  startup_wait_seconds: 20
  startup_ini_selection_enabled: true
  startup_ini_profile: "c:\\tkhspa\\tkhspa-測試區.ini"
  run_as_admin: false
  close_after_run: false

login:
  required: true
  username: "A0042"
  company_code: ""
  login_button_text: "登入"
  login_success_text: "統計報表"
  login_failure_text: "帳號或密碼錯誤"
  timeout_seconds: 30

save_as:
  dialog_title_contains: "另存新檔"
  filename_label: "檔案名稱"
  save_button_text: "存檔"
  default_extension: ".xls"
  overwrite_policy: "rename_unique" # rename_unique | overwrite | fail
  wait_timeout_seconds: 300
  stable_seconds: 3
  recovery_search_dirs:
    - "%USERPROFILE%\\Downloads"
    - "D:\\Download"
    - "D:\\Download\\記錄檔"

google_drive:
  upload_enabled: true
  auth_mode: "drive_api"
  allow_folder_url_or_id: true
  token_storage: "keyring"
  client_secret_path: ""

email:
  enabled: true
  smtp_host: ""
  smtp_port: 587
  use_tls: true
  username: ""
  recipients:
    - "joe.little7208@gmail.com"
    - "mickey.chen@mikobeaute.com"
  cc: []
  notify_on_failure: true
  notify_on_success_summary: true

r14_email:
  enabled: true
  recipients:
    - "joe.little7208@gmail.com"
    - "mickey.chen@mikobeaute.com"
    - "rae.hsu@mikobeaute.com"
    - "miko_03@mikobeaute.com"
    - "bbone_pu@bebetterone.com"
  cc: []
  subject_template: "{date}耗材領用報表"
  body: |
    Hi,

    附件為本日耗材領用報表，請您查收。

    RPA程式

w02_order:
  enabled: true
  next_run_date: "2026/07/03"
  recipients:
    - "joe.little7208@gmail.com"
    - "mickey.chen@mikobeaute.com"
    - "rae.hsu@mikobeaute.com"
    - "miko_03@mikobeaute.com"
    - "bbone_pu@bebetterone.com"
  cc: []
  subject_template: "W02 下單異常通知 {date}"
  body: |
    Hi,

    W02 自動下單流程有需要人工確認的品項，請查看下方明細。

    RPA程式
  pos_submission_enabled: false
  diagnostic_mode: false

scheduler:
  enabled: false
  daily_time: "01:00"
  weekly_enabled: false
  weekly_day: "Thursday"
  weekly_time: "01:00"
  retry_count: 2
  retry_interval_seconds: 60

pos_update:
  enabled: true
  update_dialog_title_contains: "程式更新需重新啟動"
  update_message_contains: "新版程式已經下載安裝完成"
  action: "click_yes_and_restart"
  expected_update_weekday: "Thursday"
  restart_wait_seconds: 180
  max_restart_wait_seconds: 300
  resume_unfinished_tasks: true

pos_recovery:
  enabled: true
  health_check_interval_seconds: 5
  restart_delay_seconds: 5
  max_restarts_per_run: 2
  kill_process_on_hang: true
  relaunch_after_kill: true
  retry_current_task_after_restart: true
  credential_keyring_service: "POSReportBot POS"

r14_transform:
  template_path: ""
  template_search_dir: "C:\\ProgramData\\POSReportBot\\templates"
  raw_search_dir: ""
  raw_filename_glob: "診所stock status - * demand planning-*-rawdata.xls"
  output_extension: ".xlsx"

r14_inventory_source:
  enabled: true
  spreadsheet_url: "https://docs.google.com/spreadsheets/d/1LfKl6LevlSuk8-OVQZNp8VFaTHyAB1NTR7Y1bpgEWUE/edit?gid=651674627#gid=651674627"
  spreadsheet_id: ""
  sheet_name: "Summary"
  item_code_column: "B"
  branch_inventory_columns:
    站前4樓: "G"
    站前11樓: "H"
    忠孝7樓: "I"
    忠孝國際醫學3樓: "J"
    忠孝健康7樓: "K"
  apply_weekday: "Friday"
