reports:
  - id: "R01"
    enabled: true
    frequency: "daily"
    name: "每日 課程服務明細表 新+舊客"
    handler: "course_service_detail"
    report_menu_text: "課程服務明細表"
    branch_mode: "all"
    date_range:
      start: "{month_start}"
      end: "{yesterday}"
    output_filename: "課程服務明細表-{start_yymmdd}-{end_yymmdd}-全部.xls"
    drive_folder_id: ""
    upload_enabled: true
    options:
      check: ["顯示銷售分店"]
      uncheck: ["不列明細"]
      other_conditions: []
    max_wait_seconds: 300
    retry_count: 1
    real_pos_validation_status: "pending_real_pos_validation"

